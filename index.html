/* =========================================================
   LANGUAGE BUTTONS — UNIQUE ORDER, NO DUPLICATES
========================================================= */

function initLangs(){

  const box=document.getElementById('langs');

  box.innerHTML='';

  LANGS.forEach(([id,native,loc],index)=>{

    const b=document.createElement('button');

    b.type='button';

    b.dataset.lang=id;

    b.innerHTML=
      `<strong>${String(index+1).padStart(2,'0')}</strong> ${native}`;

    b.onclick=()=>setLang(id,loc);

    box.appendChild(b);

  });

  updateSelectedLanguageButton();

}


function updateSelectedLanguageButton(){

  document.querySelectorAll('#langs button').forEach(b=>{
    b.classList.toggle(
      'selected',
      b.dataset.lang===lang
    );
  });

}

========================================================= */

function setOptions(id,items){

  const el=document.getElementById(id);

  if(!el)return;

  const old=el.value;

  el.innerHTML='';

  items.forEach(item=>{

    const o=document.createElement('option');

    o.value=item.value;
    o.textContent=item.text;

    el.appendChild(o);

  });

  if(
    [...el.options].some(o=>o.value===old)
  ){
    el.value=old;
  }

}

/* =========================================================
   AUDIO ENGINE
========================================================= */

function loadVoices(){

  if(!('speechSynthesis' in window))return;

  availableVoices=
    window.speechSynthesis.getVoices() || [];

}


if('speechSynthesis' in window){

  loadVoices();

  window.speechSynthesis.onvoiceschanged=
    loadVoices;

}


function getVoice(locale){

  if(!availableVoices.length){
    loadVoices();
  }

  const exact=
    availableVoices.find(v=>
      v.lang.toLowerCase()===
      locale.toLowerCase()
    );

  if(exact)return exact;

  const base=locale.split('-')[0].toLowerCase();

  return availableVoices.find(v=>
    v.lang.toLowerCase().startsWith(base)
  ) || null;

}


function speak(txt){

  if(!('speechSynthesis' in window)){

    alert(
      'Audio is not supported by this browser/device.'
    );

    return;

  }

  if(!txt)return;

  window.speechSynthesis.cancel();

  const u=
    new SpeechSynthesisUtterance(txt);

  u.lang=voiceLocale;
  u.rate=.82;
  u.pitch=1;

  const v=getVoice(voiceLocale);

  if(v){
    u.voice=v;
  }

  window.speechSynthesis.speak(u);

}


function stopAudio(){

  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }

}


function speakCurrent(section){

  const I=INST[lang];

  if(!I)return;

  let text='';

  if(section==='home')text=I.home;
  else if(section==='language')text=I.language;
  else if(section==='details')text=I.details;
  else if(section==='symptoms')text=I.symptoms;
  else if(section==='history')text=I.history;
  else if(section==='photos')text=I.photos;
  else if(section==='distance')text=I.distance;
  else if(section==='near')text=I.near;
  else if(section==='colour')text=I.colour;
  else if(section==='amsler')text=I.amsler;
  else if(section==='result')text=I.result;

  speak(text);

}

function go(id){

  stopAudio();

  document
    .querySelectorAll('.screen')
    .forEach(s=>s.classList.remove('active'));

  const target=document.getElementById(id);

  if(target){
    target.classList.add('active');
  }

  updateSteps(id);

  if([
    'home',
    'language',
    'details',
    'symptoms',
    'history',
    'photos',
    'distance',
    'near',
    'colour',
    'amsler',
    'result'
  ].includes(id)){

    setTimeout(()=>{
      speakCurrent(id);
    },350);

  }

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


function updateSteps(id){

  const current=steps.indexOf(id);

  document.getElementById('steps').innerHTML=

    steps.map((s,i)=>{

      let label=s;

      const stepNames={
        home:tr('welcome'),
        language:tr('chooseLanguage'),
        details:tr('patientDetails'),
        symptoms:tr('symptoms'),
        history:tr('history'),
        photos:tr('photos'),
        distance:tr('distance'),
        near:tr('near'),
        colour:tr('colour'),
        amsler:tr('amsler'),
        result:tr('result'),
        report:tr('report')
      };

      label=stepNames[s]||s;

      if(i<=current){
        return `<span>✓ ${i+1}. ${label}</span>`;
      }

      return `<span>${i+1}. ${label}</span>`;

    }).join('');

}

  },

    dots:['#5e86aa','#6c9a72','#a65c68']
  }
];


function createPlate(data,index){

  const wrap=document.createElement('div');

  wrap.className='card';

  wrap.style.padding='12px';

  const title=document.createElement('div');

  title.className='small';

  title.textContent=
    `${tr('plate')} ${index+1}`;

  const plate=document.createElement('div');

  plate.className='plate';

  const ish=document.createElement('div');

  ish.className='ish';

  ish.style.background=
    data.bg[index%data.bg.length];


  /* Few background dots */
  for(let i=0;i<48;i++){

    const dot=document.createElement('i');

    dot.className='dot';

    const size=
      4+Math.random()*5;

    dot.style.width=size+'px';
    dot.style.height=size+'px';

    dot.style.left=
      (8+Math.random()*84)+'%';

    dot.style.top=
      (8+Math.random()*84)+'%';

    dot.style.background=
      data.bg[
        Math.floor(
          Math.random()*data.bg.length
        )
      ];

    dot.style.opacity=
      (.72+Math.random()*.25);

    ish.appendChild(dot);

  }


  /* A few contrasting dots around number */
  for(let i=0;i<18;i++){

    const dot=document.createElement('i');

    dot.className='dot';

    const size=
      4+Math.random()*5;

    dot.style.width=size+'px';
    dot.style.height=size+'px';

    dot.style.left=
      (15+Math.random()*70)+'%';

    dot.style.top=
      (15+Math.random()*70)+'%';

    dot.style.background=
      data.dots[
        Math.floor(
          Math.random()*data.dots.length
        )
      ];

    ish.appendChild(dot);

  }


  /* DIRECT NUMBER */
  const number=document.createElement('div');

  number.style.position='absolute';
  number.style.left='50%';
  number.style.top='50%';
  number.style.transform=
    'translate(-50%,-50%)';

  number.style.fontSize='50px';
  number.style.fontWeight='700';

  /* User requested 75% opacity */
  number.style.opacity='.75';

  number.style.color=
    data.dots[index%data.dots.length];

  number.style.textShadow=
    '0 1px 2px rgba(0,0,0,.12)';

  number.textContent=data.number;

  ish.appendChild(number);

  plate.appendChild(ish);

  const instruction=document.createElement('div');

  instruction.className='plateInstruction';

  instruction.textContent=
    tr('enterNumber');

  const input=document.createElement('input');

  input.type='text';

  input.inputMode='numeric';

  input.placeholder=
    tr('enterNumber');

  input.dataset.plate=index+1;

  input.style.marginTop='8px';

  input.setAttribute(
    'aria-label',
    `${tr('plate')} ${index+1}`
  );

  wrap.appendChild(title);
  wrap.appendChild(plate);
  wrap.appendChild(instruction);
  wrap.appendChild(input);

  return wrap;

}


function renderPlates(){

  const area=document.getElementById('plates');

  if(!area)return;

  area.innerHTML='';

  COLOUR_PLATES.forEach((p,i)=>{

    area.appendChild(
      createPlate(p,i)
    );

  });

}

function preview(inp,id){

  const f=inp.files[0];

  if(!f)return;

  const img=document.getElementById(id);

  img.src=
    URL.createObjectURL(f);

  img.style.display='block';

}


/* =========================================================
   AI-ASSISTED RULE BASED SUMMARY
========================================================= */

function makeResult(navigate=true){

  const dre=
    document.getElementById('dRE').value;

  const dle=
    document.getElementById('dLE').value;

  const nre=
    document.getElementById('nRE').value;

  const nle=
    document.getElementById('nLE').value;

  const ar=
    document.getElementById('aRE').value;

  const al=
    document.getElementById('aLE').value;

  let flags=[];


  if(dre!=='6/6'||dle!=='6/6'){

    flags.push(
      tr('belowNormal')
    );

  }


  if(
    ar!=='Normal'||
    al!=='Normal'
  ){

    flags.push(
      tr('amslerAlert')
    );

  }


  if(
    document
      .getElementById('symptom')
      .value
      .trim()
  ){

    flags.push(
      tr('symptomRecorded')
    );

  }


  let html='';


  if(flags.length){

    html+=`

      <div class="resultBox amber">

        <b>${tr('attention')}</b>

        <ul>
          ${flags
            .map(x=>`<li>${x}</li>`)
            .join('')}
        </ul>

      </div>

    `;

  }else{

    html+=`

      <div class="resultBox">

        <b>
          ${tr('noAlert')}
        </b>

      </div>

    `;

  }


  html+=`

    <table>

      <tr>
        <th>${tr('test')}</th>
        <th>${tr('right')}</th>
        <th>${tr('left')}</th>
      </tr>

      <tr>
        <td>${tr('distanceVA')}</td>
        <td>${dre}</td>
        <td>${dle}</td>
      </tr>

      <tr>
        <td>${tr('nearVA')}</td>
        <td>${nre}</td>
        <td>${nle}</td>
      </tr>

      <tr>
        <td>${tr('amslerResult')}</td>
        <td>${ar}</td>
        <td>${al}</td>
      </tr>

    </table>

    `;


  document.getElementById(
    'summary'
  ).innerHTML=html;


  if(navigate){
    go('result');
  }

}

========================================================= */

function addTestMarkers(){

  const d=document.getElementById('distanceChart');

  if(d && !document.getElementById('distanceMarker')){

    const marker=document.createElement('div');

    marker.id='distanceMarker';

    marker.className='notice';

    marker.style.marginTop='10px';

    marker.innerHTML=
      `<b>${tr('positionMarker')}</b><br>
       ${tr('oneMetre')} — keep the patient exactly 1 m from screen.`;

    d.parentNode.insertBefore(
      marker,
      d.nextSibling
    );

  }

  const n=document.getElementById('nearChart');

  if(n && !document.getElementById('nearMarker')){

    const marker=document.createElement('div');

    marker.id='nearMarker';

    marker.className='notice';

    marker.style.marginTop='10px';

    marker.innerHTML=
      `<b>${tr('fortyCm')}</b><br>
       Keep the screen exactly 40 cm from the eyes.`;

    n.parentNode.insertBefore(
      marker,
      n.nextSibling
    );

  }

}
